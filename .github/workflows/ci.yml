name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - 'v*'

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get version
        id: get_version
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/get-version

      - name: Build image as OCI archive
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          REF_INPUT: ${{ github.ref_name }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        id: build
        run: |
          if [ -n "${VERSION}" ]; then
            REF_NAME="${VERSION}"
          else
            REF_NAME="${REF_INPUT}"
          fi
          SAFE_REF_NAME=$(echo "${REF_NAME}" | sed 's/\//-/g')
          IMAGE_TAR=image-${SAFE_REF_NAME}.tar
          docker buildx build --platform linux/amd64 --build-arg BUILD_TYPE=production --target production --output type=oci,dest=${IMAGE_TAR} .
          ls -lh ${IMAGE_TAR}
          echo "safe_ref_name=${SAFE_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ steps.build.outputs.safe_ref_name }}
          path: image-${{ steps.build.outputs.safe_ref_name }}.tar
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -vv --maxfail=1 --durations=10 | tee pytest.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pre-commit
        run: pre-commit run --all-files
